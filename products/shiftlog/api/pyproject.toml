[project]
name = "shiftlog-api"
version = "0.1.0"
description = "ShiftLog API — workflow inference + execution for SMB owners. Cafe-first vertical."
requires-python = ">=3.11"
# Depends on factory-core (the shared package at the repo root).
# Install order from a fresh venv:
#   pip install -e ../../..       # installs factory-core
#   pip install -e .              # installs shiftlog-api
dependencies = [
    "factory-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.18",  # required for File/Form parsing on /infer-from-media
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
